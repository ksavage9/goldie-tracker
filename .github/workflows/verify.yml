name: Verify on iOS

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Pick an iPad simulator
        id: sim
        run: echo "udid=$(xcrun simctl list devices available -j | python3 ci/pick_ipad.py)" >> "$GITHUB_OUTPUT"

      - name: Build the app with the real iOS SDK
        working-directory: GoldieTracker.swiftpm
        run: |
          set -o pipefail
          xcodebuild -list
          xcodebuild build -scheme "Goldie Tracker" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "${{ runner.temp }}/app" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "${{ runner.temp }}/app-build.log" | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "${{ runner.temp }}/app-build.log"
          echo "--- Warnings in the app's own code:"
          grep -E "GoldieTracker\.swiftpm/[^ ]+\.swift:[0-9]+:[0-9]+: warning:" "${{ runner.temp }}/app-build.log" | sort -u || echo "(none)"

      - name: Run the tests on the simulator
        run: |
          set -o pipefail
          python3 ci/prepare_tests.py
          cd Verification
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; print(next((x for x in s if x.endswith("-Package")), s[0]))')
          echo "Scheme: $SCHEME"
          xcodebuild test -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "${{ runner.temp }}/tests" -resultBundlePath "${{ runner.temp }}/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "${{ runner.temp }}/test.log" \
            | grep -E "Test Case .* (passed|failed)|error:|Executed|TEST (SUCCEEDED|FAILED)|FREE SPACE"

      - name: Launch the real app
        run: bash ci/smoke.sh "${{ steps.sim.outputs.udid }}" "${{ runner.temp }}/app/Build/Products" "${{ runner.temp }}"

      - name: Tour the app's screens
        continue-on-error: true
        run: bash ci/tour.sh "${{ steps.sim.outputs.udid }}" "${{ runner.temp }}"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/crashes"
          find ~/Library/Logs/DiagnosticReports -iname "*Goldie*" -exec cp {} "${{ runner.temp }}/crashes/" \; 2>/dev/null || true
          ls "${{ runner.temp }}/crashes"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/crashes
            ${{ runner.temp }}/Tests.xcresult
            ${{ runner.temp }}/Tour.xcresult
